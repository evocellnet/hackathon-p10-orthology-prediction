[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ancestra"
version = "0.1.0"
description = "Orthology inference by progressive reconstruction of ancestral proteomes (HOGs in OrthoXML)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "lxml>=4.9"]

[project.optional-dependencies]
test = ["pytest>=7"]
pyham = ["pyham>=1.1"]

[tool.setuptools.packages.find]
include = ["ancestra*"]

[tool.setuptools.package-data]
ancestra = ["schemas/*.xsd", "schemas/README"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer-running tests (simulator timing)"]
